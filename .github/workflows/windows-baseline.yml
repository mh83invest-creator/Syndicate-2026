name: Windows baseline (unmodified SyndicatFX)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msys2:
    name: Build upstream 0.0.6.1022 (32-bit)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: upstream
    steps:
      - name: Check out tagged upstream engine source
        uses: actions/checkout@v4
        with:
          repository: swfans/syndicatfx
          ref: 0.0.6.1022
          path: upstream
          persist-credentials: false

      - name: Install 32-bit MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            unzip
            wget
            mingw-w64-i686-python-pip
            mingw-w64-i686-toolchain
            mingw-w64-i686-autotools
            mingw-w64-i686-libpng
            mingw-w64-i686-SDL2
            mingw-w64-i686-openal
            mingw-w64-i686-libvorbis
            mingw-w64-i686-libogg

      - name: Install Python build helper
        run: python -m pip install polib

      - name: Install upstream WildMIDI release
        run: |
          wget -q https://github.com/Mindwerks/wildmidi/releases/download/wildmidi-0.4.5/wildmidi-0.4.5-win32.zip
          unzip -q wildmidi-0.4.5-win32.zip
          cp wildmidi-0.4.5-win32/*.h /mingw32/include/
          cp wildmidi-0.4.5-win32/*.a /mingw32/lib/
          cp wildmidi-0.4.5-win32/*.dll /mingw32/bin/

      - name: Generate configure scripts
        run: autoreconf -ivf

      - name: Configure original 32-bit engine
        env:
          CFLAGS: "-m32"
          CXXFLAGS: "-m32"
          LDFLAGS: "-m32"
        run: |
          mkdir -p release
          cd release
          ../configure --prefix="/" --enable-lbs-structs-expand

      - name: Compile unmodified engine
        run: make -C release V=1

      - name: Install into distributable staging folder
        run: make -C release V=1 DESTDIR="$PWD/release/pkg" install

      - name: Publish Windows baseline build (no retail game data)
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-2026-unmodified-windows-baseline
          path: upstream/release/pkg/**
          if-no-files-found: error
          retention-days: 14
