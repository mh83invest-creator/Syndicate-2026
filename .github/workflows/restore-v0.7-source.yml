name: Restore v0.7 complete engine source to main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-v0.7-source.yml']
permissions:
  contents: write
jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned unmodified open source engine
        run: |
          set -euo pipefail
          rm -rf engine
          git clone --depth 1 --branch 0.0.6.1022 https://github.com/swfans/syndicatfx.git engine
          rm -rf engine/.git
      - name: Apply camera-edge experiment to assembly
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/syndre.sx')
          src = p.read_text()
          marker = "scroll_map:\t/* 0x1e400 */"
          assert src.count(marker) == 1
          pos = src.index(marker)
          start = src.index("\t\tmov    0x4(%esp),%edx", pos)
          anchor = "\t\tcmpb   $0x0,EXPORT_SYMBOL(lbKeyOn)+0x48"
          stop = src.index(anchor, start)
          assert "mov    0x8(%esp),%eax" in src[start:stop]
          replacement = """\t\tmov    0x4(%esp),%edx
          \t\tmov    0x8(%esp),%eax
          #if !defined(DOS)
          \t\tcmp    $8,%edx
          \t\tja     camera_26_not_left
          \t\txor    %edx,%edx
          \t\tjmp    camera_26_x_done
          camera_26_not_left:
          \t\tcmp    $630,%edx
          \t\tjb     camera_26_x_done
          \t\tmov    $638,%edx
          camera_26_x_done:
          \t\tcmp    $8,%eax
          \t\tja     camera_26_not_top
          \t\txor    %eax,%eax
          \t\tjmp    camera_26_y_done
          camera_26_not_top:
          \t\tcmp    $390,%eax
          \t\tjb     camera_26_y_done
          \t\tmov    $398,%eax
          camera_26_y_done:
          #endif
          """
          replacement = "\n".join(line.lstrip() for line in replacement.splitlines()) + "\n"
          p.write_text(src[:start] + replacement + src[stop:])
          assert p.read_text().count("camera_26_x_done") == 3
          print("Applied release-specific camera edge experimental change")
          PY
      - name: Change only company configuration menu pacing
        working-directory: engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game.c')
          s = p.read_text()
          assert s.count('game_update_full(bool wait)') == 1
          assert s.count('const int max_fps = 16;') == 1
          s = s.replace('game_update_full(bool wait)', 'game_update_full(bool wait, int max_fps)')
          s = s.replace('    const int max_fps = 16;\n', '')
          assert s.count('game_update_full(true);') == 1
          s = s.replace('game_update_full(true);', 'game_update_full(true, 16);')
          s += '\n/* Experimental menu-only cadence. Mission update remains 16 FPS. */\nvoid game_update_menu(void)\n{\n    game_update_full(true, 30);\n}\n'
          p.write_text(s)
          p = Path('src/game.h')
          s = p.read_text()
          assert 'void game_update (void);' in s
          p.write_text(s.replace('void game_update (void);','void game_update (void);\nvoid game_update_menu (void);'))
          p = Path('conf/wrappers_game.conf')
          s = p.read_text()
          assert s.count('game_update\t') == 1
          s = s.replace('game_update\t', 'game_update_menu\t\t\tC\tv\ngame_update\t',1)
          p.write_text(s)
          p = Path('src/syndre.sx')
          s = p.read_text()
          marker = 'configure_company:\t/* 0x175c0 */'
          assert s.count(marker) == 1
          start = s.index(marker)
          needle = 'call   ac_game_update'
          idx = s.index(needle,start)
          assert s[start:idx].count(needle) == 0
          assert idx-start < 24000, 'menu call is outside expected function'
          # Verify the next instructions correspond to configure_company menu input.
          assert 'EXPORT_SYMBOL(lbKeyOn)+0x1c' in s[idx:idx+160]
          s = s[:idx] + s[idx:].replace(needle, 'call   ac_game_update_menu',1)
          # Independently identified map_selection screen. Patch only its update call.
          map_marker = 'map_selection:\t/* 0x27e00 */'
          assert s.count(map_marker) == 1
          map_start = s.index(map_marker)
          map_idx = s.index(needle, map_start)
          assert 0 < map_idx - map_start < 14000
          # Must be the map selection update at original source line 31916.
          assert 'call   ac_swap_wscreen' in s[map_idx-700:map_idx], 'Expected map screen presentation immediately before update'
          assert 'call   ac_game_update_menu' not in s[map_start:map_idx], 'Unexpected prior menu update'
          s = s[:map_idx] + s[map_idx:].replace(needle, 'call   ac_game_update_menu', 1)
          # Briefing tactical map: update follows draw_brief_tact_map, screen swap, mouse removal.
          briefing_anchor = 'call   draw_brief_tact_map'
          assert s.count(briefing_anchor) >= 1
          briefing_candidates = []
          import re
          for hit in re.finditer(r'call   ac_game_update\b', s):
              chunk = s[max(0,hit.start()-1200):hit.start()]
              if briefing_anchor in chunk and 'call   ac_swap_wscreen' in chunk:
                  briefing_candidates.append(hit.start())
          assert len(briefing_candidates) == 1, ('briefing candidates', len(briefing_candidates))
          brief_idx = briefing_candidates[0]
          s = s[:brief_idx] + s[brief_idx:].replace(needle, 'call   ac_game_update_menu', 1)
          p.write_text(s)
          print('30 Hz: company, world-map and briefing tactical map; all others 16 Hz')
          assert s.count('call   ac_game_update_menu') == 3
          assert len(re.findall(r'call   ac_game_update\b', s)) == 10
          PY
      - name: Verify all known working v0.7 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('engine/src/syndre.sx').read_text()
          c=Path('engine/src/game.c').read_text()
          assert s.count('call   ac_game_update_menu') == 3
          assert s.count('call   ac_game_update\n') == 10
          assert s.count('camera_26_x_done') == 3
          assert 'game_update_full(true, 16)' in c
          assert 'game_update_full(true, 30)' in c
          print('v0.7 source checks passed; original mission update remains 16 FPS')
          PY
      - name: Replace obsolete root build configuration and commit source
        run: |
          set -euo pipefail
          git config user.name "Syndicate 2026 Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Source code and verified workflows become the new primary branch contents.
          for f in .github/workflows/*.yml; do
            case "$f" in
              .github/workflows/restore-v0.7-source.yml|.github/workflows/windows-source-v0.7.yml) ;;
              *) git rm -f -- "$f" ;;
            esac
          done
          cat > README.md <<'EOF'
          # Syndicate 2026 — Working v0.7 source baseline

          This repository tracks the **actual native source** of Syndicate 2026,
          derived from public GPL SyndicatFX tag `0.0.6.1022`, plus changes validated
          by Windows playtests through v0.7.

          - `engine/`: complete imported source with camera edge scrolling fix,
            native Windows engine and 30 FPS pacing on company configuration,
            world-map selection and briefing tactical map.
          - Mission loop remains at original 16 FPS. Other menu loops unchanged.
          - `.github/workflows/windows-source-v0.7.yml` builds the committed source
            on Windows i686 and rejects MSYS runtime audio dependencies.
          - `.github/workflows/restore-v0.7-source.yml` preserves the reproducible
            baseline import recipe. Do not re-run casually after new development!
          - **No proprietary Syndicate retail game data is committed**. Users must
            supply their legally obtained game data separately to run builds.
          - Development continues here in `main`; historical branches remain
            available for recovery. Prior working v0.6/v0.7 test packages should
            stay separate until subsequent builds pass gameplay tests.

          ## Provenance

          Upstream: https://github.com/swfans/syndicatfx tag 0.0.6.1022.
          Validated assembly, camera and timing changes recreated from
          `diagnostics/camera-v0.4` workflow `menu-fps-v0.7.yml`.
          License and original author files are retained under `engine/`.
          EOF
          git add -A
          git commit -m "Restore complete working v0.7 source and eliminate main branch regression" || true
          git push origin HEAD:main
