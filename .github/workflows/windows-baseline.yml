name: Engine baseline build (32-bit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-baseline:
    name: Build unmodified SyndicatFX 0.0.6.1022 (32-bit Linux)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
      - name: Check out exact upstream release
        uses: actions/checkout@v4
        with:
          repository: swfans/syndicatfx
          ref: 0.0.6.1022
          fetch-depth: 0
          persist-credentials: false
      - name: Install 32-bit development dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            build-essential autoconf automake libtool make pkg-config \
            gcc-multilib g++-multilib lib32z1 python3 python3-polib \
            libsdl2-dev:i386 libopenal-dev:i386 \
            libvorbis-dev:i386 libvorbisfile3:i386 \
            libogg-dev:i386 libwildmidi-dev:i386 libpng-dev:i386
      - name: Generate configure script
        run: autoreconf -ivf
      - name: Configure engine (32-bit)
        env:
          CFLAGS: "-m32"
          CXXFLAGS: "-m32"
          LDFLAGS: "-m32"
          PKG_CONFIG_PATH: "/usr/lib/i386-linux-gnu/pkgconfig"
        run: |
          mkdir -p release
          cd release
          ../configure --prefix="/" --enable-lbs-structs-expand
      - name: Compile engine
        run: make -C release V=1
      - name: Package baseline binary
        run: |
          cd release
          make V=1 DESTDIR="$PWD/pkg" install
      - name: Upload Linux build (no retail game data)
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-2026-unmodified-linux-baseline
          path: release/pkg/**
          if-no-files-found: error
          retention-days: 14
