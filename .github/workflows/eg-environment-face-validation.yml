name: Syndicate 2026 EG-v0.1 environment face unit tests
on:
  push:
    branches:
      - fix/graphics-sdl2-scaler-isolated-2026-11-01
    paths:
      - 'engine/bflibrary/tests/eg_environment_face.*'
      - 'engine/bflibrary/tests/eg_environment_face_test.c'
      - 'engine/bflibrary/tests/eg_environment_legacy_compose.*'
      - '.github/workflows/eg-environment-face-validation.yml'
  workflow_dispatch:
jobs:
  environment-face:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Windows 32-bit MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc
      - name: Compile and run experimental face renderer tests
        shell: msys2 {0}
        run: |
          cd engine/bflibrary/tests
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic eg_environment_face.c eg_environment_face_test.c -o eg_environment_face_test.exe
          ./eg_environment_face_test.exe
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic eg_environment_legacy_compose.c eg_environment_legacy_compose_test.c -o eg_environment_legacy_compose_test.exe
          ./eg_environment_legacy_compose_test.exe
