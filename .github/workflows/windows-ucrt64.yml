name: Windows engine build (UCRT64 experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ucrt64:
    name: Compile unmodified engine on Windows UCRT64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: upstream
    steps:
      - name: Check out upstream SyndicatFX 0.0.6.1022
        uses: actions/checkout@v4
        with:
          repository: swfans/syndicatfx
          ref: 0.0.6.1022
          path: upstream
          persist-credentials: false
      - name: Install supported UCRT64 Windows dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            wget
            unzip
            python
            python-pip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            autoconf
            automake
            libtool
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
      - name: Install translation helper
        run: |
          python -m pip install --break-system-packages polib
      - name: Build native UCRT64 WildMIDI dependency
        run: |
          git clone --depth 1 --branch wildmidi-0.4.5 https://github.com/Mindwerks/wildmidi.git wildmidi-source
          cmake -S wildmidi-source -B wildmidi-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build wildmidi-build
          cmake --install wildmidi-build
      - name: Generate configure scripts
        run: autoreconf -ivf
      - name: Configure native Windows engine
        run: |
          mkdir -p release
          cd release
          ../configure --prefix="/" --enable-lbs-structs-expand
      - name: Compile native Windows engine
        run: make -C release V=1
      - name: Package compiled binary
        run: |
          cd release
          make V=1 DESTDIR="$PWD/pkg" install
      - name: Upload engine-only Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-2026-windows-ucrt64-experimental
          path: upstream/release/pkg/**
          if-no-files-found: error
          retention-days: 14
